name: Local engineering checks
on: [push, pull_request, workflow_dispatch]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install 'sympy>=1.12,<2' 'PyYAML>=6,<7'
      - run: python scripts/check_project.py --out .runtime/ci-reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engineering-checks
          path: .runtime/ci-reports
